<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nova — A personal AI voice assistant that understands speech and responds using voice. Open websites, search the web, get the time, do calculations, and more." />
  <title>Nova — AI Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Animated background particles -->
  <div class="bg-particles" id="bgParticles" aria-hidden="true"></div>

  <!-- Main container -->
  <div class="app-container">

    <!-- Header -->
    <header class="app-header" id="appHeader">
      <div class="header-left">
        <div class="logo-mark">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <circle cx="14" cy="14" r="12" stroke="url(#logoGrad)" stroke-width="2.5" />
            <circle cx="14" cy="14" r="5" fill="url(#logoGrad)" />
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
                <stop stop-color="#7c5cfc" />
                <stop offset="1" stop-color="#00d4ff" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="header-text">
          <h1>Nova</h1>
          <span class="header-subtitle">AI Voice Assistant</span>
        </div>
      </div>
      <div class="header-right">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-label" id="statusLabel">Ready</span>
        </div>
        <button class="btn-icon" id="btnClearChat" title="Clear conversation" aria-label="Clear conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Conversation panel -->
    <main class="conversation-panel" id="conversationPanel">
      <div class="conversation-list" id="conversationList">
        <!-- Welcome message -->
        <div class="msg msg-assistant msg-welcome" id="welcomeMsg">
          <div class="msg-avatar">
            <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
              <circle cx="14" cy="14" r="12" stroke="url(#avatarGrad)" stroke-width="2" />
              <circle cx="14" cy="14" r="5" fill="url(#avatarGrad)" />
              <defs>
                <linearGradient id="avatarGrad" x1="0" y1="0" x2="28" y2="28">
                  <stop stop-color="#7c5cfc" />
                  <stop offset="1" stop-color="#00d4ff" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="msg-content">
            <div class="msg-bubble">
              <p class="welcome-title">Hello, I'm <strong>Nova</strong></p>
              <p class="welcome-sub">Your personal AI voice assistant. Tap the microphone to start speaking.</p>
              <div class="capabilities-grid">
                <div class="capability-card" data-command="What time is it?">
                  <span class="cap-icon">🕐</span>
                  <span class="cap-label">Tell the time</span>
                </div>
                <div class="capability-card" data-command="Search for AI news">
                  <span class="cap-icon">🔍</span>
                  <span class="cap-label">Search the web</span>
                </div>
                <div class="capability-card" data-command="Open YouTube">
                  <span class="cap-icon">🌐</span>
                  <span class="cap-label">Open websites</span>
                </div>
                <div class="capability-card" data-command="Calculate 25 times 4">
                  <span class="cap-icon">🧮</span>
                  <span class="cap-label">Calculations</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Listening overlay / visualizer -->
    <div class="listening-overlay" id="listeningOverlay">
      <div class="waveform-container" id="waveformContainer">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <p class="listening-text" id="listeningText">Listening…</p>
      <p class="interim-text" id="interimText"></p>
    </div>

    <!-- Bottom controls -->
    <footer class="controls-bar" id="controlsBar">
      <div class="controls-inner">
        <!-- Text input fallback -->
        <div class="text-input-wrap" id="textInputWrap">
          <input
            type="text"
            class="text-input"
            id="textInput"
            placeholder="Type a command…"
            autocomplete="off"
            aria-label="Type a command"
          />
        </div>

        <!-- Mic button -->
        <button class="mic-btn" id="btnMic" title="Start listening" aria-label="Start listening">
          <span class="mic-btn-ring"></span>
          <span class="mic-btn-ring mic-btn-ring--2"></span>
          <svg class="mic-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <svg class="stop-icon hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
          </svg>
        </button>

        <!-- Send button for text input -->
        <button class="send-btn" id="btnSend" title="Send command" aria-label="Send command">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Toast notification -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts (modules) -->
  <script src="js/textToSpeech.js"></script>
  <script src="js/commandProcessor.js"></script>
  <script src="js/speechRecognition.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
